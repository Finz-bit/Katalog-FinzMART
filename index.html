<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinzMART</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#f4f6f8;
  color:#202124;
  min-height:100vh;
}

/* HEADER */
header{
  background:linear-gradient(135deg,#008f5a,#00bd78);
  color:white;
  padding:14px 16px;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow:0 3px 15px #0002;
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.owner-btn{
  border:0;
  background:white;
  color:#008f5a;
  padding:9px 15px;
  border-radius:22px;
  font-weight:bold;
  cursor:pointer;
}

/* HERO */
.hero{
  max-width:1100px;
  margin:18px auto;
  padding:28px 22px;
  border-radius:22px;
  color:white;
  background:
    radial-gradient(circle at 90% 10%,#ffffff25,transparent 35%),
    linear-gradient(135deg,#006f49,#00c979);
  box-shadow:0 8px 25px #00a86b30;
}

.hero h1{
  font-size:30px;
  line-height:1.15;
  margin-bottom:8px;
}

.hero p{
  font-size:15px;
  opacity:.95;
  line-height:1.5;
}

/* SEARCH */
.search{
  max-width:1100px;
  margin:18px auto;
  padding:0 15px;
}

.search input{
  width:100%;
  padding:15px 17px;
  border:2px solid transparent;
  border-radius:15px;
  outline:none;
  background:white;
  font-size:15px;
  box-shadow:0 4px 18px #0000000d;
}

.search input:focus{
  border-color:#00a86b;
}

/* KATEGORI */
.categories{
  max-width:1100px;
  margin:12px auto;
  padding:0 15px 5px;
  display:flex;
  gap:8px;
  overflow-x:auto;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{
  display:none;
}

.categories button{
  border:1px solid #e2e5e8;
  padding:10px 15px;
  border-radius:22px;
  background:white;
  color:#444;
  white-space:nowrap;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}

.categories button.active{
  background:#00a86b;
  color:white;
  border-color:#00a86b;
  box-shadow:0 4px 12px #00a86b30;
}

/* PRODUK */
.products{
  max-width:1100px;
  margin:22px auto;
  padding:0 15px 30px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
}
.favorite-btn{
  position:absolute;
  top:10px;
  right:10px;
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:white;
  box-shadow:0 3px 10px #0002;
  font-size:20px;
  cursor:pointer;
  z-index:5;
}

.card{
  position:relative;
  background:white;
  border-radius:17px;
  overflow:hidden;
  box-shadow:0 4px 16px #0000000d;
  border:1px solid #eeeeee;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 24px #00000018;
}

.card img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  background:#f0f1f2;
}

.card-content{
  padding:12px;
}

.number{
  color:#999;
  font-size:11px;
}

.category{
  color:#00a86b;
  font-size:11px;
  font-weight:bold;
  margin-top:5px;
  text-transform:uppercase;
}

.name{
  font-weight:700;
  font-size:14px;
  line-height:1.35;
  margin:7px 0;
  min-height:38px;
}

.price{
  color:#00a86b;
  font-weight:800;
  font-size:17px;
}
  
.discount{
  display:inline-block;
  margin-left:5px;
  padding:3px 6px;
  border-radius:6px;
  background:#e53935;
  color:white;
  font-size:10px;
  font-weight:bold;
}
  
.buy{
  display:block;
  text-align:center;
  margin-top:10px;
  padding:10px 8px;
  background:#00a86b;
  color:white;
  text-decoration:none;
  border-radius:10px;
  font-size:13px;
  font-weight:bold;
}

/* PANEL OWNER */
#ownerPanel{
  display:none;
  max-width:1100px;
  margin:20px auto 30px;
  padding:20px;
  background:white;
  border-radius:20px;
  box-shadow:0 5px 20px #0001;
}

#ownerPanel h2{
  margin-bottom:15px;
}

#ownerPanel h3{
  margin-bottom:8px;
}

#ownerPanel input,
#ownerPanel select{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:1px solid #ddd;
  border-radius:10px;
  outline:none;
  background:white;
}

#ownerPanel input:focus,
#ownerPanel select:focus{
  border-color:#00a86b;
}

.panel-btn{
  border:0;
  padding:10px 15px;
  border-radius:10px;
  margin-top:7px;
  font-weight:bold;
  cursor:pointer;
}

.save{
  background:#00a86b;
  color:white;
}

.logout{
  background:#e53935;
  color:white;
}

.preview{
  width:130px;
  height:130px;
  object-fit:cover;
  border-radius:12px;
  margin-top:8px;
  display:none;
}

/* PRODUK ADMIN */
.admin-product{
  border-top:1px solid #eee;
  padding:14px 0;
}

.admin-product img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:10px;
  vertical-align:middle;
  margin-right:10px;
}

.admin-product button{
  border:0;
  padding:7px 10px;
  margin:4px;
  border-radius:8px;
  cursor:pointer;
}

/* DETAIL PRODUK */

.product-modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0009;
  z-index:200;
  align-items:center;
  justify-content:center;
  padding:15px;
  backdrop-filter:blur(4px);
}

.product-detail{
  width:100%;
  max-width:430px;
  max-height:90vh;
  overflow-y:auto;
  background:white;
  border-radius:22px;
  position:relative;
  box-shadow:0 15px 50px #0005;
  animation:productPopup .2s ease;
}

@keyframes productPopup{
  from{
    opacity:0;
    transform:scale(.94) translateY(10px);
  }
  to{
    opacity:1;
    transform:scale(1) translateY(0);
  }
}

.close-product{
  position:absolute;
  top:12px;
  right:12px;
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#ffffffdd;
  font-size:20px;
  cursor:pointer;
  z-index:2;
}

.detail-image{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
}

.detail-content{
  padding:20px;
}

.detail-category{
  color:#00a86b;
  font-size:12px;
  font-weight:bold;
  text-transform:uppercase;
}

.detail-content h2{
  margin:7px 0;
  font-size:22px;
}

.detail-price{
  color:#00a86b;
  font-size:21px;
  font-weight:800;
  margin:8px 0 12px;
}

.detail-description{
  color:#555;
  font-size:14px;
  line-height:1.6;
  margin-bottom:18px;
}

.detail-buy{
  display:block;
  text-align:center;
  padding:13px;
  background:#00a86b;
  color:white;
  text-decoration:none;
  border-radius:12px;
  font-weight:bold;
}

/* LOGIN */
.login-box{
  display:none;
  position:fixed;
  inset:0;
  background:#0009;
  z-index:100;
  align-items:center;
  justify-content:center;
  padding:15px;
  backdrop-filter:blur(4px);
}

.login{
  width:100%;
  max-width:380px;
  background:white;
  padding:25px;
  border-radius:20px;
  box-shadow:0 15px 50px #0004;
}

.login h2{
  margin-bottom:15px;
}

.login input{
  width:100%;
  padding:13px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:10px;
  outline:none;
}

.login input:focus{
  border-color:#00a86b;
}

#loginError{
  color:#e53935;
  margin-top:10px;
  font-size:13px;
}

/* TABLET */
@media(max-width:900px){
  .products{
    grid-template-columns:repeat(3,1fr);
  }
}

/* HP */
@media(max-width:600px){

  header{
    padding:12px 13px;
  }

  .logo{
    font-size:20px;
  }

  .owner-btn{
    padding:8px 12px;
    font-size:12px;
  }

  .hero{
    margin:14px 10px;
    padding:24px 18px;
    border-radius:20px;
  }

  .hero h1{
    font-size:24px;
  }

  .hero p{
    font-size:13px;
  }

  .search{
    margin:15px auto;
    padding:0 10px;
  }

  .search input{
    padding:14px;
  }

  .categories{
    padding:0 10px 4px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    padding:0 10px 25px;
    margin-top:18px;
  }

  .card{
    border-radius:14px;
  }

  .card-content{
    padding:10px;
  }

  .name{
    font-size:13px;
    min-height:35px;
  }

  .price{
    font-size:16px;
  }

  .buy{
    padding:9px 6px;
    font-size:12px;
  }

  #ownerPanel{
    margin:15px 10px 25px;
    padding:16px;
  }
}

/* HP KECIL */
@media(max-width:360px){

  .products{
    gap:8px;
  }

  .hero h1{
    font-size:22px;
  }

  .logo{
    font-size:18px;
  }

  .owner-btn{
    font-size:11px;
  }
  }
</style>
</head>

<body>

<header>
<div class="header">
<div class="logo">🛍️ FinzMART</div>

<button class="owner-btn" onclick="openLogin()">
🔐 Owner
</button>
</div>
</header>

<section class="hero">
<h1>Belanja lebih mudah di FinzMART</h1>
<p>Temukan produk pilihan dan cek produknya langsung.</p>
</section>

<div class="search">
<input
id="search"
placeholder="🔎 Cari produk..."
oninput="renderProducts()">
</div>

<div class="categories">

<button onclick="showFavorites()">
❤️ Favorit Saya
</button>

<button class="active" onclick="setCategory('Semua',this)">
Semua
</button>

<button onclick="setCategory('Fashion',this)">
👕 Fashion
</button>

<button onclick="setCategory('Sandal',this)">
👡 Sandal
</button>

<button onclick="setCategory('Parfum',this)">
🌸 Parfum
</button>

<button onclick="setCategory('Aksesoris',this)">
💎 Aksesoris
</button>

<button onclick="setCategory('Elektronik',this)">
📱 Elektronik
</button>

</div>

<div id="products" class="products">
<p>Memuat produk...</p>
</div>


<section id="ownerPanel">

<h2>📊 Panel Owner</h2>

<button class="panel-btn logout" onclick="logout()">
Keluar
</button>

<hr><br>

<h3 id="formTitle">➕ Tambah Produk</h3>

<input id="pName" placeholder="Nama produk">

<input id="pPrice" placeholder="Harga contoh: Rp25.000">
<input id="pOldPrice" placeholder="Harga sebelum diskon (opsional)">
  
<select id="pCategory">
<option value="Fashion">Fashion</option>
<option value="Sandal">Sandal</option>
<option value="Parfum">Parfum</option>
<option value="Aksesoris">Aksesoris</option>
<option value="Elektronik">Elektronik</option>
</select>

<label>
📸 Pilih foto dari Galeri
</label>

<input
id="pImageFile"
type="file"
accept="image/*"
onchange="previewImage(event)">

<img id="preview" class="preview">

<input id="pLink" placeholder="Link affiliate Tokopedia">

<button class="panel-btn save" onclick="saveProduct()">
💾 Simpan Produk
</button>

<button
id="cancelEdit"
class="panel-btn"
onclick="cancelEdit()"
style="display:none">

Batal Edit

</button>

<br><br>

<p id="uploadStatus"></p>

<hr><br>

<h3>📦 Produk Kamu</h3>

<div id="adminProducts"></div>

</section>

<!-- DETAIL PRODUK -->
<div id="productModal" class="product-modal">

  <div class="product-detail">

    <button class="close-product" onclick="closeProductDetail()">
      ✕
    </button>

    <img id="detailImage" class="detail-image">

    <div class="detail-content">

      <span id="detailCategory" class="detail-category"></span>

      <h2 id="detailName"></h2>

      <div id="detailPrice" class="detail-price"></div>

      <p id="detailDescription" class="detail-description"></p>

      <a
        id="detailBuy"
        class="detail-buy"
        href="#"
        target="_blank"
        rel="noopener">
        🛍️ Lihat di Tokopedia
      </a>

    </div>

  </div>

</div>
  
<div id="loginBox" class="login-box">

<div class="login">

<h2>🔐 Login Owner</h2>

<input
id="email"
type="email"
placeholder="Email Owner">

<input
id="password"
type="password"
placeholder="Password">

<button
class="panel-btn save"
onclick="login()">

Masuk

</button>

<button
class="panel-btn"
onclick="closeLogin()">

Batal

</button>

<p id="loginError"></p>

</div>
</div>








 



<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ==================================================
   FIREBASE CONFIG
   ================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyDb3LcMiBnrwYg4Uy_Y_odwSyeHsiV_BVA",
  authDomain: "finzmart-bfaa6.firebaseapp.com",
  projectId: "finzmart-bfaa6",
  storageBucket: "finzmart-bfaa6.firebasestorage.app",
  messagingSenderId: "1044595942342",
  appId: "1:1044595942342:web:46502112bd75c4616c48c7"
};

/* ==================================================
   CLOUDINARY
   ================================================== */

const CLOUD_NAME = "gmukf90s";

const UPLOAD_PRESET = "finzmart_upload";


/* FIREBASE */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* DATA */

let products = [];

let activeCategory = "Semua";

let editingId = null;


/* LOGIN */

window.openLogin=function(){

  document.getElementById("loginBox")
  .style.display="flex";

}

window.closeLogin=function(){

  document.getElementById("loginBox")
  .style.display="none";

}


window.login=async function(){

  const email =
  document.getElementById("email").value;

  const password =
  document.getElementById("password").value;

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    closeLogin();

  }catch(error){

    document.getElementById("loginError")
    .innerText="Login gagal. Periksa email dan password.";

  }

}


window.logout=async function(){

  await signOut(auth);

}


/* AUTH */

onAuthStateChanged(auth,(user)=>{

  if(user){

    document.getElementById("ownerPanel")
    .style.display="block";

    loadAdminProducts();

  }else{

    document.getElementById("ownerPanel")
    .style.display="none";

  }

});


/* LOAD */

async function loadProducts(){

  try{

    const snapshot =
    await getDocs(collection(db,"products"));

    products=[];

    snapshot.forEach(item=>{

      products.push({

        id:item.id,

        ...item.data()

      });

    });

    renderProducts();

  }catch(error){

    console.error(error);

    document.getElementById("products")
    .innerHTML=
    "<p>Gagal memuat produk.</p>";

  }

}


/* RENDER */

window.renderProducts=function(){

  const container =
  document.getElementById("products");

  const search =
  document.getElementById("search")
  .value
  .toLowerCase();

  container.innerHTML="";

  const filtered =
  products.filter(p=>{

    const categoryOK =
    activeCategory==="Semua" ||
    p.category===activeCategory;

    const searchText = search.toLowerCase();

const searchOK =
  (p.name || "")
    .toLowerCase()
    .includes(searchText) ||
  String(p.number || "")
    .includes(searchText);

    return categoryOK && searchOK;

  });


  if(filtered.length===0){

    container.innerHTML=
    "<p>Belum ada produk.</p>";

    return;

  }


  filtered.forEach((p,index)=>{

    const nomor =
    p.number || index+1;
    const discount = p.oldPrice
  ? Math.round(
      ((parseInt(p.oldPrice.replace(/\D/g,"")) -
        parseInt(p.price.replace(/\D/g,""))) /
        parseInt(p.oldPrice.replace(/\D/g,""))) * 100
    )
  : 0;

    container.innerHTML += `

      <div class="card" onclick="openProductDetail(${products.indexOf(p)})">
<button
  class="favorite-btn"
  onclick="toggleFavorite(event, ${products.indexOf(p)})">
  ${favorites.some(f => f.id === p.id) ? "❤️" : "🤍"}
</button>
        <img
        src="${p.image}"
        alt="${p.name}">

        <div class="card-content">

          <div class="number">
          Produk #${nomor}
          </div>

          <div class="category">
          ${p.category}
          </div>

          <div class="name">
          ${p.name}
          </div>

          <div class="price">
  ${p.oldPrice ? `<del>${p.oldPrice}</del> ` : ""}
  ${p.price}
  ${discount > 0 ? `<span class="discount">-${discount}%</span>` : ""}
</div>

          <a
class="buy"
href="${p.link}"
target="_blank"
rel="noopener"
onclick="event.stopPropagation()">

          🛒 Beli di Tokopedia

          </a>

        </div>

      </div>

    `;

  });

}

/* DETAIL PRODUK */

window.openProductDetail=function(index){

  const p = products[index];

  if(!p) return;

  document.getElementById("detailImage").src =
    p.image || "";

  document.getElementById("detailName").textContent =
    p.name || "Produk";

  document.getElementById("detailCategory").textContent =
    p.category || "Produk";

  document.getElementById("detailPrice").textContent =
    p.price || "";

  document.getElementById("detailDescription").textContent =
    p.description || "Produk pilihan dari FinzMART.";

  document.getElementById("detailBuy").href =
    p.link || "#";

  document.getElementById("productModal").style.display =
    "flex";
};


window.closeProductDetail=function(){

  document.getElementById("productModal").style.display =
    "none";

};


document.getElementById("productModal")
.addEventListener("click",function(e){

  if(e.target === this){

    closeProductDetail();

  }

});
  /* FAVORIT */

let favorites = JSON.parse(
  localStorage.getItem("finzmartFavorites") || "[]"
);

window.toggleFavorite = function(event, index){

  event.stopPropagation();

  const product = products[index];

  if(!product) return;

  const favoriteIndex = favorites.findIndex(
    p => p.id === product.id
  );

  if(favoriteIndex === -1){

    favorites.push(product);

  }else{

    favorites.splice(favoriteIndex, 1);

  }

  localStorage.setItem(
    "finzmartFavorites",
    JSON.stringify(favorites)
  );

  renderProducts();

};
  window.showFavorites = function(){

  const container =
    document.getElementById("products");

  container.innerHTML = "";

  if(favorites.length === 0){

    container.innerHTML =
      "<p>Belum ada produk favorit ❤️</p>";

    return;

  }

  favorites.forEach((p,index)=>{

    container.innerHTML += `

      <div class="card"
        onclick="openFavoriteDetail(${index})">

        <button
          class="favorite-btn"
          onclick="removeFavorite(event, ${index})">
          ❤️
        </button>

        <img
          src="${p.image}"
          alt="${p.name}">

        <div class="card-content">

          <div class="number">
            Produk #${p.number || index+1}
          </div>

          <div class="category">
            ${p.category || ""}
          </div>

          <div class="name">
            ${p.name || ""}
          </div>

          <div class="price">
            ${p.price || ""}
          </div>

          <a
            class="buy"
            href="${p.link || "#"}"
            target="_blank"
            rel="noopener"
            onclick="event.stopPropagation()">

            🛒 Beli di Tokopedia

          </a>

        </div>

      </div>

    `;

  });

};
  /* FUNGSI FAVORIT */

window.openFavoriteDetail = function(index){

  const p = favorites[index];

  if(!p) return;

  document.getElementById("detailImage").src =
    p.image || "";

  document.getElementById("detailName").textContent =
    p.name || "Produk";

  document.getElementById("detailCategory").textContent =
    p.category || "Produk";

  document.getElementById("detailPrice").textContent =
    p.price || "";

  document.getElementById("detailDescription").textContent =
    p.description || "Produk pilihan dari FinzMART.";

  document.getElementById("detailBuy").href =
    p.link || "#";

  document.getElementById("productModal").style.display =
    "flex";

};

window.removeFavorite = function(event,index){

  event.stopPropagation();

  favorites.splice(index,1);

  localStorage.setItem(
    "finzmartFavorites",
    JSON.stringify(favorites)
  );

  showFavorites();

};
  
/* CATEGORY */

window.setCategory=function(category,button){

  activeCategory=category;

  document
  .querySelectorAll(".categories button")
  .forEach(b=>b.classList.remove("active"));

  button.classList.add("active");

  renderProducts();

}


/* PREVIEW */

window.previewImage=function(event){

  const file =
  event.target.files[0];

  if(!file)return;

  const preview =
  document.getElementById("preview");

  preview.src=
  URL.createObjectURL(file);

  preview.style.display="block";

}


/* CLOUDINARY UPLOAD */

async function uploadImage(file){

  const formData =
  new FormData();

  formData.append("file",file);

  formData.append(
    "upload_preset",
    UPLOAD_PRESET
  );


  const response =
  await fetch(
    `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
    {
      method:"POST",
      body:formData
    }
  );


  if(!response.ok){

    throw new Error(
      "Upload foto gagal"
    );

  }


  const data =
  await response.json();

  return data.secure_url;

}


/* SAVE PRODUCT */

window.saveProduct=async function(){

  const user=auth.currentUser;

  if(!user){

    alert("Silakan login sebagai Owner.");

    return;

  }


  const name =
  document.getElementById("pName").value.trim();

  const price =
  document.getElementById("pPrice").value.trim();

  const oldPrice =
document.getElementById("pOldPrice").value.trim();
  
  const category =
  document.getElementById("pCategory").value;

  const link =
  document.getElementById("pLink").value.trim();

  const file =
  document.getElementById("pImageFile").files[0];


  if(!name || !price || !link){

    alert("Lengkapi nama, harga, dan link.");

    return;

  }


  try{

    let imageURL = "";

    document.getElementById("uploadStatus")
    .innerText="⏳ Menyimpan produk...";


    if(file){

      document.getElementById("uploadStatus")
      .innerText="📸 Mengupload foto...";

      imageURL =
      await uploadImage(file);

    }


    if(editingId){

      const oldProduct =
      products.find(p=>p.id===editingId);

      await updateDoc(
        doc(db,"products",editingId),
        {

          name,
          price,
          oldPrice,
          category,
          link,

          ...(imageURL
          ? {image:imageURL}
          : {})

        }
      );

      alert("Produk berhasil diperbarui.");

    }else{

      const nextNumber =
      products.length + 1;

      await addDoc(
        collection(db,"products"),
        {

          number:nextNumber,

          name,
          price,
          oldPrice,
          category,
          link,
          image:imageURL,

          createdAt:Date.now()

        }
      );

      alert("Produk berhasil ditambahkan.");

    }


    resetForm();

    await loadProducts();

    await loadAdminProducts();

    document.getElementById("uploadStatus")
    .innerText="";

  }catch(error){

    console.error(error);

    alert(
      "Terjadi kesalahan: "+
      error.message
    );

    document.getElementById("uploadStatus")
    .innerText="";

  }

}


/* ADMIN LIST */

async function loadAdminProducts(){

  const box =
  document.getElementById("adminProducts");

  box.innerHTML="Memuat...";


  const snapshot =
  await getDocs(collection(db,"products"));

  box.innerHTML="";


  snapshot.forEach(item=>{

    const p=item.data();

    box.innerHTML += `

      <div class="admin-product">

        <img
        src="${p.image || ''}"
        alt="">

        <b>
        #${p.number || "-"} ${p.name}
        </b>

        <br>

        ${p.price}

        <br>

        <button
        onclick="startEdit('${item.id}')">

        ✏️ Edit

        </button>

        <button
        onclick="deleteProduct('${item.id}')">

        🗑️ Hapus

        </button>

      </div>

    `;

  });

}


/* EDIT */

window.startEdit=function(id){

  const p =
  products.find(x=>x.id===id);

  if(!p)return;

  editingId=id;

  document.getElementById("pName").value=
  p.name || "";

  document.getElementById("pPrice").value=
  p.price || "";

  document.getElementById("pCategory").value=
  p.category || "Fashion";

  document.getElementById("pLink").value=
  p.link || "";

  document.getElementById("formTitle")
  .innerText="✏️ Edit Produk";

  document.getElementById("cancelEdit")
  .style.display="inline-block";

  window.scrollTo({
    top:document.getElementById("ownerPanel")
    .offsetTop,
    behavior:"smooth"
  });

}


/* CANCEL */

window.cancelEdit=function(){

  resetForm();

}


function resetForm(){

  editingId=null;

  document.getElementById("pName").value="";

  document.getElementById("pPrice").value="";

  document.getElementById("pLink").value="";

  document.getElementById("pImageFile").value="";

  document.getElementById("preview").style.display="none";

  document.getElementById("formTitle")
  .innerText="➕ Tambah Produk";

  document.getElementById("cancelEdit")
  .style.display="none";

}


/* DELETE */

window.deleteProduct=async function(id){

  if(!confirm("Hapus produk ini?"))return;

  try{

    await deleteDoc(
      doc(db,"products",id)
    );

    await loadProducts();

    await loadAdminProducts();

  }catch(error){

    alert(
      "Gagal menghapus: "+
      error.message
    );

  }

}


/* START */

loadProducts();
