<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinzMART</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f6f8;
  color:#222;
}

header{
  background:#00a86b;
  color:white;
  padding:16px;
  position:sticky;
  top:0;
  z-index:10;
}

.header{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:23px;
  font-weight:bold;
}

.owner-btn{
  border:0;
  background:white;
  color:#00a86b;
  padding:9px 14px;
  border-radius:20px;
  font-weight:bold;
}

.hero{
  max-width:1100px;
  margin:20px auto;
  padding:30px 20px;
  border-radius:20px;
  color:white;
  background:linear-gradient(135deg,#007d50,#00c878);
}

.hero h1{
  font-size:30px;
  margin-bottom:8px;
}

.search{
  max-width:1100px;
  margin:20px auto;
  padding:0 15px;
}

.search input{
  width:100%;
  padding:15px;
  border:0;
  border-radius:14px;
  outline:none;
  box-shadow:0 3px 15px #0001;
}

.categories{
  max-width:1100px;
  margin:15px auto;
  padding:0 15px;
  display:flex;
  gap:8px;
  overflow:auto;
}

.categories button{
  border:0;
  padding:10px 15px;
  border-radius:20px;
  background:white;
  white-space:nowrap;
}

.categories button.active{
  background:#00a86b;
  color:white;
}

.products{
  max-width:1100px;
  margin:25px auto;
  padding:0 15px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.card{
  background:white;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 4px 15px #0001;
}

.card img{
  width:100%;
  aspect-ratio:1;
  object-fit:cover;
  background:#eee;
}

.card-content{
  padding:12px;
}

.number{
  color:#777;
  font-size:12px;
}

.category{
  color:#00a86b;
  font-size:12px;
  font-weight:bold;
  margin-top:4px;
}

.name{
  font-weight:bold;
  margin:7px 0;
}

.price{
  color:#00a86b;
  font-weight:bold;
  font-size:18px;
}

.buy{
  display:block;
  text-align:center;
  margin-top:10px;
  padding:10px;
  background:#00a86b;
  color:white;
  text-decoration:none;
  border-radius:10px;
}

#ownerPanel{
  display:none;
  max-width:1100px;
  margin:20px auto;
  padding:20px;
  background:white;
  border-radius:18px;
}

#ownerPanel input,
#ownerPanel select{
  width:100%;
  padding:12px;
  margin:6px 0;
  border:1px solid #ddd;
  border-radius:10px;
}

.panel-btn{
  border:0;
  padding:10px 15px;
  border-radius:10px;
  margin-top:7px;
}

.save{
  background:#00a86b;
  color:white;
}

.logout{
  background:#e53935;
  color:white;
}

.preview{
  width:130px;
  height:130px;
  object-fit:cover;
  border-radius:12px;
  margin-top:8px;
  display:none;
}

.admin-product{
  border-top:1px solid #ddd;
  padding:14px 0;
}

.admin-product img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:10px;
  vertical-align:middle;
  margin-right:10px;
}

.admin-product button{
  border:0;
  padding:7px 10px;
  margin:4px;
  border-radius:8px;
}

.login-box{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:100;
  align-items:center;
  justify-content:center;
}

.login{
  width:90%;
  max-width:380px;
  background:white;
  padding:25px;
  border-radius:18px;
}

.login input{
  width:100%;
  padding:12px;
  margin:7px 0;
}

#loginError{
  color:#e53935;
  margin-top:10px;
}

@media(max-width:800px){
  .products{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:600px){
  .products{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .hero{
    margin:15px 10px;
  }
}
</style>
</head>

<body>

<header>
<div class="header">
<div class="logo">🛍️ FinzMART</div>

<button class="owner-btn" onclick="openLogin()">
🔐 Owner
</button>
</div>
</header>

<section class="hero">
<h1>Belanja lebih mudah di FinzMART</h1>
<p>Temukan produk pilihan dan cek produknya langsung.</p>
</section>

<div class="search">
<input
id="search"
placeholder="🔎 Cari produk..."
oninput="renderProducts()">
</div>

<div class="categories">
<button class="active" onclick="setCategory('Semua',this)">Semua</button>
<button onclick="setCategory('Fashion',this)">👕 Fashion</button>
<button onclick="setCategory('Sandal',this)">👡 Sandal</button>
<button onclick="setCategory('Parfum',this)">🌸 Parfum</button>
<button onclick="setCategory('Aksesoris',this)">💎 Aksesoris</button>
<button onclick="setCategory('Elektronik',this)">📱 Elektronik</button>
</div>

<div id="products" class="products">
<p>Memuat produk...</p>
</div>


<section id="ownerPanel">

<h2>📊 Panel Owner</h2>

<button class="panel-btn logout" onclick="logout()">
Keluar
</button>

<hr><br>

<h3 id="formTitle">➕ Tambah Produk</h3>

<input id="pName" placeholder="Nama produk">

<input id="pPrice" placeholder="Harga contoh: Rp25.000">

<select id="pCategory">
<option value="Fashion">Fashion</option>
<option value="Sandal">Sandal</option>
<option value="Parfum">Parfum</option>
<option value="Aksesoris">Aksesoris</option>
<option value="Elektronik">Elektronik</option>
</select>

<label>
📸 Pilih foto dari Galeri
</label>

<input
id="pImageFile"
type="file"
accept="image/*"
onchange="previewImage(event)">

<img id="preview" class="preview">

<input id="pLink" placeholder="Link affiliate Tokopedia">

<button class="panel-btn save" onclick="saveProduct()">
💾 Simpan Produk
</button>

<button
id="cancelEdit"
class="panel-btn"
onclick="cancelEdit()"
style="display:none">

Batal Edit

</button>

<br><br>

<p id="uploadStatus"></p>

<hr><br>

<h3>📦 Produk Kamu</h3>

<div id="adminProducts"></div>

</section>


<div id="loginBox" class="login-box">

<div class="login">

<h2>🔐 Login Owner</h2>

<input
id="email"
type="email"
placeholder="Email Owner">

<input
id="password"
type="password"
placeholder="Password">

<button
class="panel-btn save"
onclick="login()">

Masuk

</button>

<button
class="panel-btn"
onclick="closeLogin()">

Batal

</button>

<p id="loginError"></p>

</div>
</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ==================================================
   FIREBASE CONFIG
   ================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyDb3LcMiBnrwYg4Uy_Y_odwSyeHsiV_BVA",
  authDomain: "finzmart-bfaa6.firebaseapp.com",
  projectId: "finzmart-bfaa6",
  storageBucket: "finzmart-bfaa6.firebasestorage.app",
  messagingSenderId: "1044595942342",
  appId: "1:1044595942342:web:46502112bd75c4616c48c7"
};

/* ==================================================
   CLOUDINARY
   ================================================== */

const CLOUD_NAME = "gmukf90s";

const UPLOAD_PRESET = "finzmart_upload";


/* FIREBASE */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* DATA */

let products = [];

let activeCategory = "Semua";

let editingId = null;


/* LOGIN */

window.openLogin=function(){

  document.getElementById("loginBox")
  .style.display="flex";

}

window.closeLogin=function(){

  document.getElementById("loginBox")
  .style.display="none";

}


window.login=async function(){

  const email =
  document.getElementById("email").value;

  const password =
  document.getElementById("password").value;

  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    closeLogin();

  }catch(error){

    document.getElementById("loginError")
    .innerText="Login gagal. Periksa email dan password.";

  }

}


window.logout=async function(){

  await signOut(auth);

}


/* AUTH */

onAuthStateChanged(auth,(user)=>{

  if(user){

    document.getElementById("ownerPanel")
    .style.display="block";

    loadAdminProducts();

  }else{

    document.getElementById("ownerPanel")
    .style.display="none";

  }

});


/* LOAD */

async function loadProducts(){

  try{

    const snapshot =
    await getDocs(collection(db,"products"));

    products=[];

    snapshot.forEach(item=>{

      products.push({

        id:item.id,

        ...item.data()

      });

    });

    renderProducts();

  }catch(error){

    console.error(error);

    document.getElementById("products")
    .innerHTML=
    "<p>Gagal memuat produk.</p>";

  }

}


/* RENDER */

window.renderProducts=function(){

  const container =
  document.getElementById("products");

  const search =
  document.getElementById("search")
  .value
  .toLowerCase();

  container.innerHTML="";

  const filtered =
  products.filter(p=>{

    const categoryOK =
    activeCategory==="Semua" ||
    p.category===activeCategory;

    const searchOK =
    (p.name || "")
    .toLowerCase()
    .includes(search);

    return categoryOK && searchOK;

  });


  if(filtered.length===0){

    container.innerHTML=
    "<p>Belum ada produk.</p>";

    return;

  }


  filtered.forEach((p,index)=>{

    const nomor =
    p.number || index+1;

    container.innerHTML += `

      <div class="card">

        <img
        src="${p.image}"
        alt="${p.name}">

        <div class="card-content">

          <div class="number">
          Produk #${nomor}
          </div>

          <div class="category">
          ${p.category}
          </div>

          <div class="name">
          ${p.name}
          </div>

          <div class="price">
          ${p.price}
          </div>

          <a
          class="buy"
          href="${p.link}"
          target="_blank"
          rel="noopener">

          🛒 Beli di Tokopedia

          </a>

        </div>

      </div>

    `;

  });

}


/* CATEGORY */

window.setCategory=function(category,button){

  activeCategory=category;

  document
  .querySelectorAll(".categories button")
  .forEach(b=>b.classList.remove("active"));

  button.classList.add("active");

  renderProducts();

}


/* PREVIEW */

window.previewImage=function(event){

  const file =
  event.target.files[0];

  if(!file)return;

  const preview =
  document.getElementById("preview");

  preview.src=
  URL.createObjectURL(file);

  preview.style.display="block";

}


/* CLOUDINARY UPLOAD */

async function uploadImage(file){

  const formData =
  new FormData();

  formData.append("file",file);

  formData.append(
    "upload_preset",
    UPLOAD_PRESET
  );


  const response =
  await fetch(
    `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
    {
      method:"POST",
      body:formData
    }
  );


  if(!response.ok){

    throw new Error(
      "Upload foto gagal"
    );

  }


  const data =
  await response.json();

  return data.secure_url;

}


/* SAVE PRODUCT */

window.saveProduct=async function(){

  const user=auth.currentUser;

  if(!user){

    alert("Silakan login sebagai Owner.");

    return;

  }


  const name =
  document.getElementById("pName").value.trim();

  const price =
  document.getElementById("pPrice").value.trim();

  const category =
  document.getElementById("pCategory").value;

  const link =
  document.getElementById("pLink").value.trim();

  const file =
  document.getElementById("pImageFile").files[0];


  if(!name || !price || !link){

    alert("Lengkapi nama, harga, dan link.");

    return;

  }


  try{

    let imageURL = "";

    document.getElementById("uploadStatus")
    .innerText="⏳ Menyimpan produk...";


    if(file){

      document.getElementById("uploadStatus")
      .innerText="📸 Mengupload foto...";

      imageURL =
      await uploadImage(file);

    }


    if(editingId){

      const oldProduct =
      products.find(p=>p.id===editingId);

      await updateDoc(
        doc(db,"products",editingId),
        {

          name,
          price,
          category,
          link,

          ...(imageURL
          ? {image:imageURL}
          : {})

        }
      );

      alert("Produk berhasil diperbarui.");

    }else{

      const nextNumber =
      products.length + 1;

      await addDoc(
        collection(db,"products"),
        {

          number:nextNumber,

          name,
          price,
          category,
          link,
          image:imageURL,

          createdAt:Date.now()

        }
      );

      alert("Produk berhasil ditambahkan.");

    }


    resetForm();

    await loadProducts();

    await loadAdminProducts();

    document.getElementById("uploadStatus")
    .innerText="";

  }catch(error){

    console.error(error);

    alert(
      "Terjadi kesalahan: "+
      error.message
    );

    document.getElementById("uploadStatus")
    .innerText="";

  }

}


/* ADMIN LIST */

async function loadAdminProducts(){

  const box =
  document.getElementById("adminProducts");

  box.innerHTML="Memuat...";


  const snapshot =
  await getDocs(collection(db,"products"));

  box.innerHTML="";


  snapshot.forEach(item=>{

    const p=item.data();

    box.innerHTML += `

      <div class="admin-product">

        <img
        src="${p.image || ''}"
        alt="">

        <b>
        #${p.number || "-"} ${p.name}
        </b>

        <br>

        ${p.price}

        <br>

        <button
        onclick="startEdit('${item.id}')">

        ✏️ Edit

        </button>

        <button
        onclick="deleteProduct('${item.id}')">

        🗑️ Hapus

        </button>

      </div>

    `;

  });

}


/* EDIT */

window.startEdit=function(id){

  const p =
  products.find(x=>x.id===id);

  if(!p)return;

  editingId=id;

  document.getElementById("pName").value=
  p.name || "";

  document.getElementById("pPrice").value=
  p.price || "";

  document.getElementById("pCategory").value=
  p.category || "Fashion";

  document.getElementById("pLink").value=
  p.link || "";

  document.getElementById("formTitle")
  .innerText="✏️ Edit Produk";

  document.getElementById("cancelEdit")
  .style.display="inline-block";

  window.scrollTo({
    top:document.getElementById("ownerPanel")
    .offsetTop,
    behavior:"smooth"
  });

}


/* CANCEL */

window.cancelEdit=function(){

  resetForm();

}


function resetForm(){

  editingId=null;

  document.getElementById("pName").value="";

  document.getElementById("pPrice").value="";

  document.getElementById("pLink").value="";

  document.getElementById("pImageFile").value="";

  document.getElementById("preview").style.display="none";

  document.getElementById("formTitle")
  .innerText="➕ Tambah Produk";

  document.getElementById("cancelEdit")
  .style.display="none";

}


/* DELETE */

window.deleteProduct=async function(id){

  if(!confirm("Hapus produk ini?"))return;

  try{

    await deleteDoc(
      doc(db,"products",id)
    );

    await loadProducts();

    await loadAdminProducts();

  }catch(error){

    alert(
      "Gagal menghapus: "+
      error.message
    );

  }

}


/* START */

loadProducts();

</script>

</body>
    </html>
