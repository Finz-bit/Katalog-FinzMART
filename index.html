<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinzMART - Katalog Produk</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

.header {
    background: linear-gradient(135deg, #d71920, #ff5a00);
    color: white;
    padding: 28px 16px 25px;
    text-align: center;
}

.header h1 {
    margin: 0 0 8px;
    font-size: 27px;
}

.header p {
    margin: 0 0 20px;
    font-size: 14px;
}

.search-box {
    max-width: 650px;
    margin: auto;
    position: relative;
}

.search-box input {
    width: 100%;
    padding: 15px 18px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px 12px 40px;
}

.info {
    text-align: center;
    margin-bottom: 18px;
    color: #666;
    font-size: 14px;
}

.products {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.product {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,.08);
    position: relative;
}

.product img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
}

.product-content {
    padding: 11px;
}

.number {
    color: #d71920;
    font-weight: bold;
    font-size: 13px;
    margin-bottom: 5px;
}

.product-name {
    font-size: 15px;
    font-weight: bold;
    line-height: 1.3;
    min-height: 39px;
}

.price {
    margin: 8px 0;
    color: #d71920;
    font-size: 17px;
    font-weight: bold;
}

.buy {
    display: block;
    text-align: center;
    background: #00a651;
    color: white;
    text-decoration: none;
    padding: 10px;
    border-radius: 8px;
    font-weight: bold;
    font-size: 14px;
}

.buy:active {
    transform: scale(.98);
}

.empty {
    display: none;
    text-align: center;
    padding: 50px 20px;
    color: #777;
}

.footer {
    text-align: center;
    padding: 25px;
    color: #888;
    font-size: 12px;
}

@media (min-width: 700px) {
    .products {
        grid-template-columns: repeat(4, 1fr);
    }
}
</style>
</head>

<body>

<header class="header">

    <h1>🛍️ FINZMART</h1>

    <p>
        Rekomendasi produk pilihan • Cari berdasarkan nomor
    </p>

    <div class="search-box">
        <input
            type="search"
            id="search"
            placeholder="🔎 Cari nomor atau nama produk..."
            autocomplete="off"
        >
    </div>

</header>


<main class="container">

    <div class="info" id="info">
        Menampilkan semua produk
    </div>

    <div class="products" id="products"></div>

    <div class="empty" id="empty">
        <h2>😕 Produk tidak ditemukan</h2>
        <p>Coba cari nomor atau nama produk lainnya.</p>
    </div>

</main>


<footer class="footer">
    © 2026 FinzMART • Semua link produk menuju marketplace
</footer>


<script>

const products = [

    {
        no: "001",
        name: "Sandal Wanita Lucu",
        price: "Rp30.000",
        image: "https://placehold.co/600x600?text=Produk+001",
        link: "https://www.tokopedia.com/"
    },

    {
        no: "002",
        name: "Parfum Wanita",
        price: "Rp45.000",
        image: "https://placehold.co/600x600?text=Produk+002",
        link: "https://www.tokopedia.com/"
    },

    {
        no: "003",
        name: "Jam Tangan Pria",
        price: "Rp80.000",
        image: "https://placehold.co/600x600?text=Produk+003",
        link: "https://www.tokopedia.com/"
    },

    {
        no: "004",
        name: "Tas Wanita Kekinian",
        price: "Rp55.000",
        image: "https://placehold.co/600x600?text=Produk+004",
        link: "https://www.tokopedia.com/"
    },

    {
        no: "005",
        name: "Kaos Oversize",
        price: "Rp40.000",
        image: "https://placehold.co/600x600?text=Produk+005",
        link: "https://www.tokopedia.com/"
    },

    {
        no: "006",
        name: "Sepatu Casual",
        price: "Rp120.000",
        image: "https://placehold.co/600x600?text=Produk+006",
        link: "https://www.tokopedia.com/"
    },

    {
        no: "007",
        name: "Dompet Mini",
        price: "Rp25.000",
        image: "https://placehold.co/600x600?text=Produk+007",
        link: "https://www.tokopedia.com/"
    },

    {
        no: "008",
        name: "Kacamata Fashion",
        price: "Rp35.000",
        image: "https://placehold.co/600x600?text=Produk+008",
        link: "https://www.tokopedia.com/"
    },

    {
        no: "040",
        name: "Contoh Produk Nomor 40",
        price: "Rp50.000",
        image: "https://placehold.co/600x600?text=Produk+040",
        link: "https://www.tokopedia.com/"
    }

];


const productContainer = document.getElementById("products");
const searchInput = document.getElementById("search");
const empty = document.getElementById("empty");
const info = document.getElementById("info");


function tampilkanProduk(data) {

    productContainer.innerHTML = "";

    if (data.length === 0) {

        empty.style.display = "block";
        info.textContent = "Tidak ada produk ditemukan";

        return;
    }

    empty.style.display = "none";

    info.textContent =
        "Menampilkan " + data.length + " produk";

    data.forEach(product => {

        const card = document.createElement("div");

        card.className = "product";

        card.innerHTML = `

            <img
                src="${product.image}"
                alt="${product.name}"
                loading="lazy"
            >

            <div class="product-content">

                <div class="number">
                    PRODUK #${product.no}
                </div>

                <div class="product-name">
                    ${product.name}
                </div>

                <div class="price">
                    ${product.price}
                </div>

                <a
                    class="buy"
                    href="${product.link}"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    🛒 BELI DI TOKOPEDIA
                </a>

            </div>

        `;

        productContainer.appendChild(card);

    });

}


searchInput.addEventListener("input", function() {

    const keyword =
        this.value
        .toLowerCase()
        .trim();

    if (keyword === "") {

        tampilkanProduk(products);

        return;
    }

    const hasil = products.filter(product => {

        return (
            product.no.toLowerCase().includes(keyword) ||
            product.name.toLowerCase().includes(keyword)
        );

    });

    tampilkanProduk(hasil);

});


tampilkanProduk(products);

</script>

</body>
  </html>
