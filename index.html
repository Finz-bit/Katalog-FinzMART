<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FinzMART</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f6f8;
    color:#222;
}

header{
    background:#00a86b;
    color:white;
    padding:18px;
    position:sticky;
    top:0;
    z-index:10;
}

.header{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:23px;
    font-weight:bold;
}

.owner-btn{
    border:0;
    background:white;
    color:#00a86b;
    padding:9px 14px;
    border-radius:20px;
    font-weight:bold;
}

.hero{
    max-width:1100px;
    margin:20px auto;
    padding:30px 20px;
    border-radius:20px;
    color:white;
    background:linear-gradient(135deg,#007d50,#00c878);
}

.hero h1{
    font-size:30px;
    margin-bottom:8px;
}

.search{
    max-width:1100px;
    margin:20px auto;
    padding:0 15px;
}

.search input{
    width:100%;
    padding:15px;
    border:0;
    border-radius:14px;
    box-shadow:0 3px 15px #0001;
    outline:none;
}

.categories{
    max-width:1100px;
    margin:15px auto;
    padding:0 15px;
    display:flex;
    gap:8px;
    overflow:auto;
}

.categories button{
    white-space:nowrap;
    border:0;
    padding:10px 15px;
    border-radius:20px;
    background:white;
}

.categories button.active{
    background:#00a86b;
    color:white;
}

.products{
    max-width:1100px;
    margin:25px auto;
    padding:0 15px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.card{
    background:white;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 4px 15px #0001;
}

.card img{
    width:100%;
    aspect-ratio:1;
    object-fit:cover;
}

.card-content{
    padding:12px;
}

.category{
    color:#00a86b;
    font-size:12px;
    font-weight:bold;
}

.name{
    font-weight:bold;
    margin:7px 0;
}

.price{
    color:#00a86b;
    font-weight:bold;
    font-size:18px;
}

.buy{
    display:block;
    text-align:center;
    margin-top:10px;
    padding:10px;
    background:#00a86b;
    color:white;
    text-decoration:none;
    border-radius:10px;
}

#ownerPanel{
    display:none;
    max-width:1100px;
    margin:20px auto;
    padding:20px;
    background:white;
    border-radius:18px;
}

#ownerPanel input,
#ownerPanel select{
    width:100%;
    padding:12px;
    margin:6px 0;
    border:1px solid #ddd;
    border-radius:10px;
}

.panel-btn{
    border:0;
    padding:10px 15px;
    border-radius:10px;
    margin-top:7px;
    cursor:pointer;
}

.save{
    background:#00a86b;
    color:white;
}

.logout{
    background:#e53935;
    color:white;
}

.admin-product{
    border-top:1px solid #ddd;
    padding:12px 0;
}

.admin-product button{
    padding:7px;
    margin:3px;
}

.login-box{
    display:none;
    position:fixed;
    inset:0;
    background:#0008;
    z-index:100;
    align-items:center;
    justify-content:center;
}

.login{
    width:90%;
    max-width:380px;
    background:white;
    padding:25px;
    border-radius:18px;
}

.login input{
    width:100%;
    padding:12px;
    margin:7px 0;
}

@media(max-width:800px){
    .products{
        grid-template-columns:repeat(3,1fr);
    }
}

@media(max-width:600px){
    .products{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .hero{
        margin:15px 10px;
    }
}
</style>
</head>

<body>

<header>
<div class="header">

<div class="logo">🛍️ FinzMART</div>

<button class="owner-btn" onclick="openLogin()">
🔐 Owner
</button>

</div>
</header>

<section class="hero">

<h1>Belanja lebih mudah di FinzMART</h1>

<p>
Temukan produk pilihan dan cek produknya langsung.
</p>

</section>

<div class="search">

<input
id="search"
placeholder="🔎 Cari produk..."
oninput="renderProducts()">

</div>

<div class="categories">

<button class="active" onclick="setCategory('Semua',this)">
Semua
</button>

<button onclick="setCategory('Fashion',this)">
👕 Fashion
</button>

<button onclick="setCategory('Sandal',this)">
👡 Sandal
</button>

<button onclick="setCategory('Parfum',this)">
🌸 Parfum
</button>

<button onclick="setCategory('Aksesoris',this)">
💎 Aksesoris
</button>

<button onclick="setCategory('Elektronik',this)">
📱 Elektronik
</button>

</div>

<div id="products" class="products">

<p>Memuat produk...</p>

</div>


<!-- PANEL OWNER -->

<section id="ownerPanel">

<h2>📊 Panel Owner</h2>

<br>

<button class="panel-btn logout" onclick="logout()">
Keluar
</button>

<hr><br>

<h3>➕ Tambah Produk</h3>

<input id="pName" placeholder="Nama produk">

<input id="pPrice" placeholder="Harga contoh: Rp25.000">

<input id="pImage" placeholder="URL foto produk">

<select id="pCategory">

<option value="Fashion">Fashion</option>
<option value="Sandal">Sandal</option>
<option value="Parfum">Parfum</option>
<option value="Aksesoris">Aksesoris</option>
<option value="Elektronik">Elektronik</option>

</select>

<input id="pLink" placeholder="Link affiliate Tokopedia">

<button class="panel-btn save" onclick="addProduct()">
💾 Simpan Produk
</button>

<br><br>

<h3>📦 Produk Kamu</h3>

<div id="adminProducts"></div>

</section>


<!-- LOGIN -->

<div id="loginBox" class="login-box">

<div class="login">

<h2>🔐 Login Owner</h2>

<input
id="email"
type="email"
placeholder="Email Owner">

<input
id="password"
type="password"
placeholder="Password">

<button
class="panel-btn save"
onclick="login()">

Masuk

</button>

<button
class="panel-btn"
onclick="closeLogin()">

Batal

</button>

<p id="loginError"></p>

</div>

</div>


<!-- FIREBASE -->

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
updateDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


/* ==================================================
   🔥 TEMPEL FIREBASE CONFIG KAMU DI SINI
   ================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyDb3LcMiBnrwYg4Uy_Y_odwSyeHsiV_BVA",
  authDomain: "finzmart-bfaa6.firebaseapp.com",
  projectId: "finzmart-bfaa6",
  storageBucket: "finzmart-bfaa6.firebasestorage.app",
  messagingSenderId: "1044595942342",
  appId: "1:1044595942342:web:46502112bd75c4616c48c7"
};


/* FIREBASE */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


/* DATA */

let products = [];

let activeCategory = "Semua";


/* LOGIN */

window.openLogin = function(){

    document.getElementById("loginBox").style.display="flex";

}

window.closeLogin = function(){

    document.getElementById("loginBox").style.display="none";

}


window.login = async function(){

    const email =
    document.getElementById("email").value;

    const password =
    document.getElementById("password").value;

    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

        closeLogin();

    }catch(error){

        document.getElementById("loginError").innerText =
        "Login gagal. Periksa email dan password.";

    }

}


window.logout = async function(){

    await signOut(auth);

}


/* AUTH STATE */

onAuthStateChanged(auth,(user)=>{

    if(user){

        document.getElementById("ownerPanel")
        .style.display="block";

        loadAdminProducts();

    }else{

        document.getElementById("ownerPanel")
        .style.display="none";

    }

});


/* LOAD PRODUCTS */

async function loadProducts(){

    const snapshot =
    await getDocs(collection(db,"products"));

    products=[];

    snapshot.forEach((item)=>{

        products.push({

            id:item.id,

            ...item.data()

        });

    });

    renderProducts();

}


/* RENDER */

window.renderProducts=function(){

    const container =
    document.getElementById("products");

    const search =
    document.getElementById("search")
    .value
    .toLowerCase();

    container.innerHTML="";

    const filtered =
    products.filter(p=>{

        const categoryOK =
        activeCategory==="Semua" ||
        p.category===activeCategory;

        const searchOK =
        (p.name || "")
        .toLowerCase()
        .includes(search);

        return categoryOK && searchOK;

    });

    if(filtered.length===0){

        container.innerHTML=
        "<p>Produk belum tersedia.</p>";

        return;

    }

    filtered.forEach(p=>{

        container.innerHTML += `

        <div class="card">

            <img
            src="${p.image}"
            alt="${p.name}">

            <div class="card-content">

                <div class="category">
                ${p.category}
                </div>

                <div class="name">
                ${p.name}
                </div>

                <div class="price">
                ${p.price}
                </div>

                <a
                class="buy"
                href="${p.link}"
                target="_blank">

                🛒 Beli di Tokopedia

                </a>

            </div>

        </div>

        `;

    });

}


/* CATEGORY */

window.setCategory=function(category,button){

    activeCategory=category;

    document
    .querySelectorAll(".categories button")
    .forEach(b=>b.classList.remove("active"));

    button.classList.add("active");

    renderProducts();

}


/* ADD PRODUCT */

window.addProduct=async function(){

    const name =
    document.getElementById("pName").value;

    const price =
    document.getElementById("pPrice").value;

    const image =
    document.getElementById("pImage").value;

    const category =
    document.getElementById("pCategory").value;

    const link =
    document.getElementById("pLink").value;


    if(!name || !price || !image || !link){

        alert("Lengkapi semua data produk.");

        return;

    }


    await addDoc(
        collection(db,"products"),
        {

            name,
            price,
            image,
            category,
            link,

            createdAt:
            new Date()

        }

    );


    alert("Produk berhasil ditambahkan!");


    document.getElementById("pName").value="";
    document.getElementById("pPrice").value="";
    document.getElementById("pImage").value="";
    document.getElementById("pLink").value="";


    await loadProducts();

    await loadAdminProducts();

}


/* ADMIN PRODUCTS */

async function loadAdminProducts(){

    const box =
    document.getElementById("adminProducts");

    box.innerHTML="Memuat...";

    const snapshot =
    await getDocs(collection(db,"products"));

    box.innerHTML="";

    snapshot.forEach(item=>{

        const p=item.data();

        box.innerHTML += `

        <div class="admin-product">

            <b>${p.name}</b>

            <br>

            ${p.price}

            <br>

            <button
            onclick="deleteProduct('${item.id}')">

            🗑️ Hapus

            </button>

        </div>

        `;

    });

}


/* DELETE */

window.deleteProduct=async function(id){

    if(!confirm("Hapus produk ini?")) return;

    await deleteDoc(
        doc(db,"products",id)
    );

    await loadProducts();

    await loadAdminProducts();

}


/* START */

loadProducts();

</script>

</body>
</html>
